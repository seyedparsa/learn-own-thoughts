# Control: no curriculum. The full-difficulty question at the full latent budget
# from the first step, so the model must find the whole computation at once.
#
# `epochs_per_stage: 0` means exactly that -- see lyot/schedule.py -- and no
# `staging` key, so nothing adapts. Everything else is the ATC arm's recipe, which
# makes the curriculum the single difference.
#
# Expect this to be expensive per epoch: every instance runs its full min(d-1, 16)
# latent passes from epoch 0, where a curriculum starts at zero latents.
project: lyot-curriculum
save_path: runs

tasks:
  family: random_tree
  arms: 2
  length: 5
  targets: deepest
  n_train: 100000
  n_valid: 1000
  n: 20
n_nodes: 40          # node ids 0..39: 20 per component, two components

model:
  n_layer: 2
  n_head: 8
  n_embd: 768
  n_positions: 1024

curriculum: ring
method: atc
method_options:
  answer_mark: false
  hidden_prob: 0.75  # candidate dropout: the answer cannot be copied from the prompt
  budget: depth-1    # a d-hop question is answered with d-1 latents
loss: ce
max_latent_stage: 16
c_thought: 1
uniform_prob: 0.1

num_epochs: 800
batch_size_training: 128
gradient_accumulation_steps: 1
lr: 3.0e-5
weight_decay: 0.01
seed: 0
max_grad_norm: 0     # every tree20 number so far was measured with clipping off
reset_optimizer: false
shuffle_nodes: false
grow_task_difficulty: false

eval_every: 1
save_every: 50
wandb: true

epochs_per_stage: 0

group: tree20-controls
name: tree20-nocurriculum
tags: ["tree20", "control", "no-curriculum"]
